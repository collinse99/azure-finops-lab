name: Generate Cost Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Summarize sample costs
        run: |
          python scripts/summarize_costs.py \
            sample-data/sample-costs.csv \
            --output reports

      - name: Upload sample reports
        uses: actions/upload-artifact@v5
        with:
          name: sample-cost-reports
          path: reports/
          if-no-files-found: error
          retention-days: 7
